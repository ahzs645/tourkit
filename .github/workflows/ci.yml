name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check, test and build
        run: |
          npm run check
          npm test
          npm run build:examples
          npm run build:capture-studio
          npm run package:extension
      # pnpm builds a git-hosted Tourkit inside its store, which can sit under
      # a node_modules directory (pnpm/action-setup's does). Declaration emit
      # then treats Tourkit's own files as a dependency's, and an exported
      # component with an inferred return type fails with TS2883.
      - name: Build from a path inside node_modules, as a pnpm git install does
        run: |
          target="$RUNNER_TEMP/consumer/node_modules/.pnpm-store/tmp/tourkit"
          mkdir -p "$target"
          git archive HEAD | tar -x -C "$target"
          cd "$target"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify Studio, library, review and native capture in Chromium
        env:
          TUTORIAL_STUDIO_ARTIFACT_DIR: ${{ runner.temp }}/evidence/studio
          TUTORIAL_LIBRARY_ARTIFACT_DIR: ${{ runner.temp }}/evidence/library
          TUTORIAL_REVIEW_SCREENSHOTS: ${{ runner.temp }}/evidence/review
          TUTORIAL_NATIVE_ARTIFACT_DIR: ${{ runner.temp }}/evidence/native
        run: npm run test:browser
      - name: Verify captured DOM, Studio exchange and the real MV3 recorder
        env:
          TOURKIT_EXTENSION_ARTIFACT_DIR: ${{ runner.temp }}/evidence/extension
        run: |
          npm run test:capture:browser
          npm run test:extension:browser
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Keep browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            ${{ runner.temp }}/evidence
            .tmp-tourkit-capture-ui-test/evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep installable recorder and standalone Studio
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: tourkit-recorder-and-studio
          path: |
            .artifacts/tourkit-recorder-*.zip
            dist-capture-studio/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
